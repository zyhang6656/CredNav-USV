environment_name: delay20_cov100_binned_s10_eval

env:
  max_episode_steps: 512
  dt: 0.1
  init_goal_threshold: 1.0
  init_collision_threshold: 1.6
  use_filter: true

noise:
  nominal_position_std: 0.10
  nominal_velocity_std: 0.03
  burst_enabled: true
  burst_episode_prob: 1.0
  burst_duration_steps: 30
  measurement_cov_scale: 100
  measurement_delay_steps: 20
  bias_enabled: false
  bias_position_y: 0.0
  bias_duration_steps: 0
  start_mode: path_progress_binned_candidate
  path_progress_arrival_steps: 230
  path_progress_candidate_stride: 10
  risk_distance_threshold: 10.0
  tcpa_horizon: 12.0

cache:
  kf_cache_mode: read_strict

trust:
  mode: oracle_tmse
  t_min: 0.05
  t_max: 1.0
  aggregate: min_over_risk_active
  risk_distance_threshold: 10.0
  tcpa_horizon: 12.0

reward:
  success_bonus: 200.0
  collision_penalty: -300.0
  timeout_penalty: -50.0
  progress_weight: 30.0
  cte_penalty_weight: 0.1
  time_penalty: -0.01
  near_risk_weight: 3.0
